name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z or vX.Y.Z-prerelease tag; leave empty to build the selected ref only
        required: false
        type: string
      publish:
        description: Publish the selected tag after a successful build
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  PUBLISH_RELEASE: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
  TAURI_TARGET: x86_64-pc-windows-msvc

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 25
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: 校验 Release Tag 格式
        if: env.PUBLISH_RELEASE == 'true'
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw "Publishing requires an existing vX.Y.Z or vX.Y.Z-prerelease tag. Received: $env:RELEASE_TAG"
          }

      - name: Checkout requested ref
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: 固定本次构建的提交
        id: source
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve source commit.' }
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 校验 Tag Commit 属于 main
        if: env.PUBLISH_RELEASE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tagCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to resolve the checked-out tag commit.'
          }
          $status = (gh api "repos/$env:GITHUB_REPOSITORY/compare/$tagCommit...main" --jq '.status').Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to compare tag commit $tagCommit with main."
          }
          if ($status -notin @('ahead', 'identical')) {
            throw "Tag commit $tagCommit is not part of main. Comparison status: $status."
          }

      - name: 校验发布配置与签名 Secret
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'GitHub secret TAURI_SIGNING_PRIVATE_KEY is missing.'
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw 'GitHub secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing.'
          }
          $config = Get-Content -Raw -LiteralPath 'src-tauri/tauri.conf.json' | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($config.plugins.updater.pubkey) -or
              $config.plugins.updater.pubkey -eq 'REPLACE_WITH_TAURI_UPDATER_PUBLIC_KEY') {
            throw 'Commit the Tauri updater public key before building updater artifacts.'
          }
          try {
            $publicKey = [Text.Encoding]::UTF8.GetString(
              [Convert]::FromBase64String($config.plugins.updater.pubkey)
            )
          } catch {
            throw 'The Tauri updater public key is not valid Base64.'
          }
          if ($publicKey -notmatch '^untrusted comment: minisign public key: [0-9A-Fa-f]+') {
            throw 'The Tauri updater public key is not a valid minisign public key.'
          }
          $expectedEndpoint = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/latest.json"
          $endpoints = @($config.plugins.updater.endpoints)
          if ($endpoints.Count -ne 1 -or $endpoints[0] -ne $expectedEndpoint) {
            throw "Updater endpoint must match this repository: $expectedEndpoint"
          }
          if ($env:PUBLISH_RELEASE -eq 'true') {
            $tagVersion = $env:RELEASE_TAG.Substring(1)
            if ($tagVersion -ne $config.version) {
              throw "Tag version $tagVersion does not match tauri.conf.json version $($config.version)."
            }
          }

  prepare-frontend:
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version: 24.19.0
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build frontend once
        run: vp build

      - name: 保存共享前端产物
        uses: actions/upload-artifact@v7
        with:
          name: frontend-${{ needs.validate.outputs.commit }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  release-notes:
    needs: validate
    # 固定已验证的系统版本，避免 ubuntu-latest 自动迁移到 Ubuntu 26 改变发布环境。
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # 使用工作流所在提交的脚本，手动指定旧标签时也能使用新版发布工具。
      - name: Checkout release tooling and complete history
        if: env.PUBLISH_RELEASE == 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Vite+
        if: env.PUBLISH_RELEASE == 'true'
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version: 24.19.0
          cache: true
          run-install: false

      - name: Install release tooling dependencies
        if: env.PUBLISH_RELEASE == 'true'
        run: vp install --frozen-lockfile

      - name: 用 DeepSeek 生成中文发布说明
        if: env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: vp run release:notes

      - name: 保存发布说明与来源
        if: env.PUBLISH_RELEASE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes-${{ needs.validate.outputs.commit }}
          path: artifacts/release-notes/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  build-installer:
    permissions:
      contents: write
    needs: [validate, prepare-frontend, release-notes]
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      NSIS_BUNDLE_DIR: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version: 24.19.0
          cache: true
          run-install: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ env.TAURI_TARGET }}

      # rust-cache 同时缓存 Cargo 依赖下载与编译产物；不再另建共享下载缓存。
      - name: Cache Rust build output
        id: rust-cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: 下载共享前端产物
        uses: actions/download-artifact@v8
        with:
          name: frontend-${{ needs.validate.outputs.commit }}
          path: dist

      - name: 复用前端，跳过重复构建
        shell: pwsh
        run: |
          '{"build":{"beforeBuildCommand":null}}' | Set-Content -LiteralPath "$env:RUNNER_TEMP/tauri-ci.json" -Encoding utf8

      - name: 下载已校验的发布说明
        if: env.PUBLISH_RELEASE == 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-notes-${{ needs.validate.outputs.commit }}
          path: release-notes

      - name: 读取发布说明供 Release 与更新器共用
        if: env.PUBLISH_RELEASE == 'true'
        id: notes
        shell: pwsh
        run: |
          $body = Get-Content -Raw -LiteralPath 'release-notes/release.md'
          if ([string]::IsNullOrWhiteSpace($body)) { throw 'Release notes are empty.' }
          $delimiter = [guid]::NewGuid().ToString('N')
          "body<<$delimiter`n$body`n$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 构建 NSIS 安装包
        id: build
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.PUBLISH_RELEASE == 'true' && env.RELEASE_TAG || '' }}
          releaseName: ${{ env.PUBLISH_RELEASE == 'true' && format('Muse Tune {0}', env.RELEASE_TAG) || '' }}
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generateReleaseNotes: false
          releaseBody: ${{ steps.notes.outputs.body }}
          retryAttempts: 1
          releaseAssetNamePattern: MuseTune-[version]-windows-x64[ext]
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          tauriScript: vp exec tauri
          args: --target ${{ env.TAURI_TARGET }} --bundles nsis --config "${{ runner.temp }}/tauri-ci.json" -- --locked --timings

      - name: 校验并规范 NSIS 安装包
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.build.outputs.appVersion }}
        run: |
          $installers = @(Get-ChildItem -LiteralPath $env:NSIS_BUNDLE_DIR -Filter '*.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          $installer = $installers[0]
          $signaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path -LiteralPath $signaturePath -PathType Leaf) -or
              (Get-Item -LiteralPath $signaturePath).Length -eq 0) {
            throw "The updater signature is missing or empty: $signaturePath"
          }
          if ([string]::IsNullOrWhiteSpace($env:APP_VERSION)) {
            throw 'tauri-action did not return the application version.'
          }
          $shortInstallerPath = Join-Path $env:NSIS_BUNDLE_DIR "MuseTune-$($env:APP_VERSION)-windows-x64.exe"
          if ($installer.FullName -ne $shortInstallerPath) {
            Move-Item -LiteralPath $signaturePath -Destination "$shortInstallerPath.sig"
            Move-Item -LiteralPath $installer.FullName -Destination $shortInstallerPath
          }

      - name: 保存 NSIS 安装包
        id: upload-manual-artifact
        uses: actions/upload-artifact@v7
        with:
          name: MuseTune-${{ steps.build.outputs.appVersion }}-windows-x64
          path: |
            ${{ env.NSIS_BUNDLE_DIR }}/*.exe
            ${{ env.NSIS_BUNDLE_DIR }}/*.exe.sig
          if-no-files-found: error
          overwrite: true
          compression-level: 0

      - name: 添加安装包下载链接到摘要
        if: env.PUBLISH_RELEASE != 'true'
        shell: pwsh
        run: |
          "- [Download signed NSIS artifact](${{ steps.upload-manual-artifact.outputs.artifact-url }})" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: 保存 Cargo 编译耗时报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-${{ github.job }}-${{ needs.validate.outputs.commit }}
          path: src-tauri/target/cargo-timings/*.html
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

  build-portable:
    needs: [validate, prepare-frontend]
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version: 24.19.0
          cache: true
          run-install: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ env.TAURI_TARGET }}

      # 安装版与便携版使用不同特性，分别保留各自的编译缓存。
      - name: Cache Rust build output
        id: rust-cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: 下载共享前端产物
        uses: actions/download-artifact@v8
        with:
          name: frontend-${{ needs.validate.outputs.commit }}
          path: dist

      - name: 复用前端，跳过重复构建
        shell: pwsh
        run: |
          '{"build":{"beforeBuildCommand":null}}' | Set-Content -LiteralPath "$env:RUNNER_TEMP/tauri-ci.json" -Encoding utf8

      - name: 构建便携版可执行文件
        run: vp exec tauri build --target $env:TAURI_TARGET --no-bundle --features portable --config "$env:RUNNER_TEMP/tauri-ci.json" -- --locked --timings

      - name: 打包并校验便携版
        id: package
        shell: pwsh
        run: |
          $config = Get-Content -Raw -LiteralPath 'src-tauri/tauri.conf.json' | ConvertFrom-Json
          $version = $config.version
          $binary = "src-tauri/target/$env:TAURI_TARGET/release/MuseTune.exe"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf) -or
              (Get-Item -LiteralPath $binary).Length -eq 0) {
            throw "Portable executable is missing or empty: $binary"
          }
          $stage = Join-Path $env:RUNNER_TEMP "muse-tune-portable-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -LiteralPath $binary -Destination (Join-Path $stage 'MuseTune.exe')
          $archive = Join-Path $env:RUNNER_TEMP "MuseTune-$version-windows-x64-portable.zip"
          Compress-Archive -LiteralPath (Join-Path $stage 'MuseTune.exe') -DestinationPath $archive
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf) -or
              (Get-Item -LiteralPath $archive).Length -eq 0) {
            throw "Portable archive is missing or empty: $archive"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 上传便携版
        id: upload-portable-artifact
        uses: actions/upload-artifact@v7
        with:
          name: MuseTune-${{ steps.package.outputs.version }}-windows-x64-portable
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          overwrite: true
          compression-level: 0

      - name: 添加便携版下载链接到摘要
        if: env.PUBLISH_RELEASE != 'true'
        shell: pwsh
        run: |
          "- [Download portable artifact](${{ steps.upload-portable-artifact.outputs.artifact-url }})" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: 保存 Cargo 编译耗时报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-${{ github.job }}-${{ needs.validate.outputs.commit }}
          path: src-tauri/target/cargo-timings/*.html
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

  publish:
    permissions:
      contents: write
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    needs: [validate, build-installer, build-portable]
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: 下载已校验的发布说明
        uses: actions/download-artifact@v8
        with:
          name: release-notes-${{ needs.validate.outputs.commit }}
          path: release-notes

      # tauri-action 不更新已有草稿正文；重试时在这里同步为本次生成结果。
      - name: 同步草稿正文
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $draft = gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --json isDraft --jq '.isDraft'
          if ($LASTEXITCODE -ne 0 -or $draft -ne 'true') { throw 'Expected an unpublished draft release.' }
          gh release edit "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --notes-file 'release-notes/release.md'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to synchronize release notes.' }

      - name: 下载便携版构建产物
        uses: actions/download-artifact@v8
        with:
          pattern: MuseTune-*-windows-x64-portable
          path: portable
          merge-multiple: true

      - name: 上传便携版到草稿 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $archives = @(Get-ChildItem -LiteralPath 'portable' -Filter '*.zip' -File)
          if ($archives.Count -ne 1) {
            throw "Expected exactly one portable archive, found $($archives.Count)."
          }
          gh release upload "$env:RELEASE_TAG" $archives[0].FullName --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to upload the portable archive for $env:RELEASE_TAG."
          }

      - name: 校验上传的更新器清单文件
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $manifestDirectory = Join-Path $env:RUNNER_TEMP "muse-tune-updater-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $manifestDirectory | Out-Null
          gh release download "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --pattern 'latest.json' --dir $manifestDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to download latest.json for $env:RELEASE_TAG."
          }
          $manifest = Get-Content -Raw -LiteralPath (Join-Path $manifestDirectory 'latest.json') | ConvertFrom-Json
          $expectedNotes = Get-Content -Raw -LiteralPath 'release-notes/release.md'
          if ([string]::IsNullOrWhiteSpace($manifest.notes) -or $manifest.notes.Trim() -cne $expectedNotes.Trim()) {
            throw 'Updater notes do not match the generated release notes.'
          }
          if ($manifest.version.TrimStart('v') -ne $env:RELEASE_TAG.Substring(1)) {
            throw "latest.json version $($manifest.version) does not match $env:RELEASE_TAG."
          }
          $windowsUpdate = $manifest.platforms.'windows-x86_64'
          if ($null -eq $windowsUpdate -or
              [string]::IsNullOrWhiteSpace($windowsUpdate.url) -or
              [string]::IsNullOrWhiteSpace($windowsUpdate.signature)) {
            throw 'latest.json does not contain a complete windows-x86_64 update.'
          }
          $releaseJson = gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --json assets
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect the draft release for $env:RELEASE_TAG."
          }
          $assets = @($releaseJson | ConvertFrom-Json | Select-Object -ExpandProperty assets)
          # tauri-action v1 使用资产 API URL；同时兼容直接下载 URL。
          # 必须匹配当前 Release 的完整地址，不能把 URL 末尾的资产 ID 当文件名。
          $updateAssets = @($assets | Where-Object {
            $_.apiUrl -ceq $windowsUpdate.url -or $_.url -ceq $windowsUpdate.url
          })
          if ($updateAssets.Count -ne 1) {
            throw "latest.json does not reference exactly one asset in this release: $($windowsUpdate.url)"
          }
          $updateAsset = $updateAssets[0]
          if ($updateAsset.name -notlike '*.exe' -or $updateAsset.state -ne 'uploaded' -or $updateAsset.size -le 0) {
            throw "latest.json references an installer asset that is not present: $($windowsUpdate.url)"
          }

      - name: 发布已完成的 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --draft=false

  refresh-website:
    needs: publish
    # 网站只展示正式版；只有公开发布成功后才通知，不依赖 GITHUB_TOKEN 触发 release 事件。
    if: ${{ !contains(inputs.release_tag || github.ref_name, '-') }}
    uses: ./.github/workflows/notify-website.yml
    secrets:
      CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
      EDGEONE_PAGES_DEPLOY_HOOK: ${{ secrets.EDGEONE_PAGES_DEPLOY_HOOK }}
