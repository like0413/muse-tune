[package]
name = "muse-tune"
version = "0.1.0"
description = "A Windows 11 taskbar media controller"
authors = ["like0413"]
license = "MIT"
repository = "https://github.com/like0413/muse-tune"
edition = "2024"
rust-version = "1.98.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "muse_tune_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
infer = "0.19"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
rustfft = "6.4"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-fs = "2"
windows = { version = "0.61.3", features = [
  "ApplicationModel",
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "UI_ViewManagement",
  "Win32_Media_Audio",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Registry",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61.2"
windows-icons = "0.4.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
wasapi = "0.24"
flate2 = "1"
hex = "0.4"
lyrics-core = "0.1.1"
lyrics-crypto = "0.1.3"
lyrics-parsers = "0.1.3"
notify = "8"
regex = "1"
sha2 = "0.10"
strsim = "0.11"
thiserror = "2"
unicode-normalization = "0.1"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
