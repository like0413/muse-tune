"$schema" = "schemas/schema.json"

[[permission]]
identifier = "volume-popup-commands"
description = "Allows the volume popup to read and adjust the active media volume and hide itself."
commands.allow = [
  "get_current_media_volume",
  "set_current_media_volume",
  "toggle_current_media_mute",
  "get_system_volume",
  "set_system_volume",
  "toggle_system_mute",
  "hide_volume_popup",
]
